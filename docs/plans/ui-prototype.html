<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gozler-ui prototype</title>
<!--
PROTOTYPE, throwaway (docs/plans/ui-plan.md, stage 0). Open this file with a
double-click. It draws the window that docs/plans/ui-spec.md specifies, as
Windows 11 draws its common controls, on synthetic data and with no daemon.
The owner chose variant A of the filters, so the other two are gone.
Nothing here is product code, and it is deleted with the plan.
-->
<style>
:root {
  --win: #fff; --text: #000; --face: #f0f0f0; --gray: #6d6d6d;
  --hl: #0078d7; --hltext: #fff;
  --edge: #7a7a7a; --edgehot: #171717; --lbedge: #828790;
  --btn: #e1e1e1; --btnb: #adadad; --btnhot: #e5f1fb; --btnhotb: #0078d7;
  --btnpress: #cce4f7; --btnpressb: #005499;
  --rowhot: #e5f3ff; --rowsel: #cce8ff; --rowselb: #99d1ff; --rowselun: #d9d9d9;
  --div: #dcdcdc; --menu: #f9f9f9; --menub: #dadada; --menuhot: #e3e3e3;
  --link: #0066cc; --tipb: #767676; --tiptext: #575757;
  --title: #fff; --titletext: #000;
}
.hc {
  --win: #000; --text: #fff; --face: #000; --gray: #3ff23f;
  --hl: #1aebff; --hltext: #000;
  --edge: #fff; --edgehot: #1aebff; --lbedge: #fff;
  --btn: #000; --btnb: #fff; --btnhot: #1aebff; --btnhotb: #1aebff;
  --btnpress: #1aebff; --btnpressb: #fff;
  --rowhot: #000; --rowsel: #1aebff; --rowselb: #1aebff; --rowselun: #1aebff;
  --div: #fff; --menu: #000; --menub: #fff; --menuhot: #1aebff;
  --link: #ffff00; --tipb: #fff; --tiptext: #fff;
  --title: #000; --titletext: #fff;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: #5b6b7f; font: 12px "Segoe UI", system-ui, sans-serif; overflow: hidden; }
#stage { position: absolute; inset: 0 360px 0 0; overflow: auto; }

#scaler { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

/* ---------- the window ---------- */
.window { position: absolute; left: 20px; top: 20px; background: var(--win); color: var(--text);
  border: 1px solid #6f7e91; box-shadow: 0 8px 28px rgba(0,0,0,.35); display: flex; flex-direction: column;
  border-radius: 8px; overflow: hidden; }
.window.maxed { border-radius: 0; }
.titlebar { height: 31px; flex: none; display: flex; align-items: center; background: var(--title); color: var(--titletext); user-select: none; }
.titlebar .ticon { width: 16px; height: 16px; margin: 0 8px 0 9px; }
.titlebar .ttext { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.capbtn { width: 46px; height: 31px; display: flex; align-items: center; justify-content: center;
  font-family: "Segoe Fluent Icons", "Segoe MDL2 Assets"; font-size: 10px; }
.capbtn:hover { background: #e5e5e5; } .capbtn.close:hover { background: #c42b1c; color: #fff; }
.hc .capbtn:hover { background: var(--hl); color: var(--hltext); }
.menubar { height: 20px; flex: none; display: flex; background: var(--win); user-select: none; padding-left: 0; }
.mbi { padding: 0 7px; line-height: 19px; border: 1px solid transparent; }
.mbi:hover, .mbi.hot { background: #e5f3ff; border-color: #cce8ff; }
.mbi.open { background: #cce8ff; border-color: #99d1ff; }
.hc .mbi:hover, .hc .mbi.hot, .hc .mbi.open { background: var(--hl); color: var(--hltext); border-color: var(--hl); }
body:not(.cues) u.ak { text-decoration: none; }
.client { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
.strip { flex: none; display: flex; gap: 7px; padding: 11px 11px 0; }
.body { flex: 1; display: flex; padding: 11px; min-height: 0; }
.vdiv { width: 1px; background: var(--div); margin: 0 5px; flex: none; }
.right { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.splitter { height: 11px; flex: none; cursor: ns-resize; position: relative; }
.splitter::after { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 1px; background: var(--div); }

/* ---------- common controls ---------- */
.edit { height: 23px; border: 1px solid var(--edge); background: var(--win); color: var(--text); font: inherit; padding: 0 4px; outline: none; }
.edit:hover { border-color: var(--edgehot); } .edit:focus { border-color: var(--hl); }
.edit::placeholder { color: var(--gray); }
.btn { height: 23px; min-width: 75px; padding: 0 10px; border: 1px solid var(--btnb); background: var(--btn); color: var(--text); font: inherit;
  display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; outline: none; user-select: none; position: relative; }
.btn:hover:not(.dis) { background: var(--btnhot); border-color: var(--btnhotb); }
.hc .btn:hover:not(.dis) { color: var(--hltext); }
.btn:active:not(.dis), .btn.on { background: var(--btnpress); border-color: var(--btnpressb); }
.hc .btn.on { color: var(--hltext); }
.btn.def { border-color: var(--hl); box-shadow: inset 0 0 0 1px var(--hl); }
.btn:focus-visible::after, .cues .btn:focus::after { content: ""; position: absolute; inset: 3px; border: 1px dotted var(--text); }
.btn.dis { color: var(--gray); background: #ccc; border-color: #bfbfbf; }
.hc .btn.dis { background: #000; border-color: var(--gray); }
.chk { display: inline-flex; align-items: center; gap: 5px; user-select: none; outline: none; line-height: 17px; position: relative; }
.chk .box { width: 13px; height: 13px; border: 1px solid #333; background: var(--win); flex: none; display: flex; align-items: center; justify-content: center; }
.hc .chk .box { border-color: #fff; }
.chk:hover .box { border-color: var(--hl); background: var(--btnhot); }
.chk.on .box::after { content: ""; width: 7px; height: 4px; border-left: 2px solid var(--text); border-bottom: 2px solid var(--text); transform: translateY(-1px) rotate(-45deg); }
.chk.radio .box { border-radius: 50%; }
.chk.radio.on .box::after { width: 5px; height: 5px; border: 0; border-radius: 50%; background: var(--text); transform: none; }
.chk:focus-visible .lbl, .cues .chk:focus .lbl { outline: 1px dotted var(--text); }
.chk.dis { color: var(--gray); }
.lb { border: 1px solid var(--lbedge); background: var(--win); outline: none; overflow-y: auto; user-select: none; }
.lb .it { padding: 0 3px; line-height: 15px; height: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lb .it.sel { background: var(--rowselun); }
.lb:focus .it.sel { background: var(--hl); color: var(--hltext); }
.cues .lb:focus .it.cur { outline: 1px dotted var(--text); outline-offset: -1px; }
.combo { height: 23px; border: 1px solid var(--btnb); background: var(--btn); display: flex; align-items: center; padding: 0 0 0 4px; outline: none; user-select: none; position: relative; min-width: 0; }
.combo:hover { background: var(--btnhot); border-color: var(--btnhotb); }
.combo .ct { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 1px 2px; }
.combo:focus .ct { background: var(--hl); color: var(--hltext); }
.combo .arrow { width: 17px; flex: none; text-align: center; font-family: "Segoe MDL2 Assets"; font-size: 8px; }
.drop { position: absolute; background: var(--win); border: 1px solid #646464; z-index: 60; overflow-y: auto; user-select: none; }
.hc .drop { border-color: #fff; }
.drop .it { padding: 0 4px; line-height: 17px; white-space: nowrap; }
.drop .it.cur { background: var(--hl); color: var(--hltext); }
.label { line-height: 15px; user-select: none; white-space: nowrap; }
.ro { border: 0; background: transparent; color: var(--text); font: inherit; padding: 0; width: 100%; outline: none; }
.link { color: var(--link); text-decoration: underline; cursor: pointer; }
.shield { width: 14px; height: 14px; flex: none; }
.btn .shield { margin-right: 4px; }
.gbox { border: 1px solid #dcdcdc; margin: 0 0 9px; padding: 4px 11px 9px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.gbox > legend { padding: 0 3px; margin-left: -3px; }
.hc .gbox { border-color: #fff; }
.spage { position: absolute; inset: 0; display: flex; flex-direction: column; }
.spage .head { font-size: 15px; margin: 0 0 9px; }
.spage .pbody { flex: 1; min-height: 0; overflow-y: auto; }
.spage .foot { display: flex; justify-content: flex-end; padding-top: 7px; }

/* ---------- list view ---------- */

<script type="text/plain" id="helptext">gozler 0.2.1 (2026-10-18) - Instant file search for Windows NTFS

Usage: gozler [options] [search terms]

  Find files and folders by name, path, size, date or attribute. Search terms
  combine with AND. By default gozler prints one full path per line, at most 20
  unless -n says otherwise, and writes warnings and errors to stderr.

Examples:
  gozler report                  Find names that contain report
  gozler *.cs                    Find .cs files
  gozler -path C:\repo ext:cs    Find .cs files below C:\repo
  gozler *.log dm:7days          Find .log files modified in the last 7 days
  gozler "size:>1gb"             Find files larger than 1 GB
  gozler *.iso -sort size -n 10  Show the 10 largest .iso files
  gozler -n all report           Show every match, not only the first 20
  gozler /a-d report             Find only files whose names contain report
  gozler -parent C:\repo -n all  List everything directly in C:\repo
  gozler -r "^test[0-9]+\.cs$" -path C:\repo
                                 Find names that match a regular expression

Search syntax (what gozler receives; quote it for the shell as shown below):
  report                   Name contains report
  *.cs                     Whole name matches a wildcard (* and ?)
  "two words"              Name contains the phrase
  !test                    Exclude names that contain test
  a|b                      Either term; | binds tighter than a space
  C:\repo\                 Everything below that folder
  ext:cs;txt               Extension is cs or txt
  dm:7days                 Modified in the last 7 days
  size:>1mb                Larger than 1 MB
  docs\agents              Full path contains docs\agents; / works as \ too
  C:\repo\*.cs             .cs files below that folder
  *\node_modules\*         A wildcard with \ matches the whole full path
  path:"C:\Program Files"  Quotes keep the spaces in a function's value

Search functions:
  ext:cs;txt           Extension is one in the list; ext: alone finds files
                       without one
  size:>1mb            File size; also <, <=, >=, =, ranges such as 1mb..10mb,
                       and empty, tiny, small, medium, large, huge or gigantic
  dm:today, datemodified:today, date-modified:today
                       Date modified: today, yesterday, YYYY-MM-DD or Ndays;
                       also <, <=, >, >= and ranges such as
                       2026-01-01..2026-03-31
  path:text            Full path contains text; with * or ?, the whole full
                       path must match
  parent:C:\repo       Only the files and folders directly in this folder
  nopath:text          Name contains text, even with -p
  ww:word              Name contains word, with no letter or digit right before

let altAlone = false;

  if (currentDialog) { dialogKey(e); return; }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;

    else if (k === 'Escape' || k === 'F10') { MENUBAR[barKeyMode].el.classList.remove('hot'); barKeyMode = -1; }
    else if (k.length === 1) { const i = MENUBAR.findIndex(m => akOf(t(m.k)) === k); if (i >= 0) { barKeyMode = -1; openBarMenu(i, true); } }

  if (e.key === 'F10' && !e.shiftKey) { e.preventDefault(); document.body.classList.add('cues'); barKeyMode = 0; MENUBAR[0].el.classList.add('hot'); return; }
  if (e.key === 'F4' && e.altKey) { e.preventDefault(); closeWindow('Alt+F4'); return; }

  ['S13 C:\\ indexing', () => { S.hold = false; S.cIndexing = true; setText('report'); runSearch('scenario'); }],
  ['Long names, multi-select', () => { S.hold = false; setText('résumé|meeting|東京|отчёт'); S.opts.mode = 'regex'; runSearch('scenario');
    setTimeout(() => { UI.lv.focus(); setCursor(0, false, false); setCursor(4, true, false); }, 700); }],
  ['Deep paths', () => { S.hold = false; S.cols = [{ k: 'name', w: 260 }, { k: 'path', w: 560 }, { k: 'size', w: 90 }, { k: 'dm', w: 130 }]; buildHeader(); setText('node_modules\\'); runSearch('scenario'); }],
];
function setText(s) { S.text = s; UI.search.value = s; }
function clearF() { S.F.kind = 0; S.F.loc = 0; S.F.parentOnly = false; S.F.date = 0; S.F.dateCustom = null; S.F.size = 0; S.F.sizeCustom = null; S.F.attrs = [0, 0, 0, 0, 0, 0]; S.locMissing = false; syncFilterControls(); }
function resetForScenario() { S.opts = { mode: 'word', case: false, path: false }; S.daemon = 'normal'; S.cIndexing = false; S.dOffline = false; S.settings.showAll = true; if (S.exp) endExport(); S.activity = null; S.showFilters = true; clearF(); clearSelection(); layout(); }
let prevPanel = {};
function renderPanelSoon() { clearTimeout(renderPanelSoon.t); renderPanelSoon.t = setTimeout(renderPanel, 30); }
function accessKeyReport() {
  const els = [...UI.client.querySelectorAll('[data-ak]')].filter(el => el.offsetParent !== null && !el.closest('.menu'));
  const seen = {}; for (const el of els) { const k = el.dataset.ak; if (!k) continue; const name = plain(el.textContent).trim().slice(0, 22); (seen[k] = seen[k] || []).push(name); }
  const menu = MENUBAR.map(m => akOf(t(m.k)));
  const dup = Object.entries(seen).filter(([k, v]) => new Set(v).size > 1 || menu.includes(k));
  return { count: Object.keys(seen).length + menu.length, dup };
}
function renderPanel() {
  const P = document.getElementById('panel');
  if (!UI.win) return;
  const m = minSize();
  const fitPx = (screenH) => Math.ceil(m.h * S.scale) <= screenH - 40;
  const focus = document.activeElement;
  const focusName = !focus || focus === document.body ? '(none)' : focus === UI.search ? 'search box' : focus === UI.lv ? 'results list' : (focus.getAttribute('role') || focus.tagName.toLowerCase()) + ': ' + plain(focus.textContent || focus.value || '').trim().slice(0, 30);
  const sel = S.selection.kind === 'files' ? `${fmtInt(S.selection.entries.length)} files (read)` : S.selection.kind === 'reading' ? `reading ${fmtInt(S.selection.positions.length)} rows` : 'none';
  const st = statusTexts();
  const ak = accessKeyReport();
  const fields = {
    'Search text': S.text ? `"${S.text}"` : '(empty)',
    'Filter clauses': filterClauses(S.F).join(' ') || '(none)',
    'Shown': S.shown.kind === 'rows' ? `${fmtInt(S.shown.rows.length)} rows of ${fmtInt(S.shown.total)}` : S.shown.kind === 'message' ? `message: ${S.shown.msg.type}${S.shown.msg.d ? ' ' + S.shown.msg.d : ''}` : 'nothing yet',
    'In flight': Object.entries(S.inflight).filter(([, v]) => v).map(([k]) => k).join(', ') || 'none',
    'Cached rows': [...S.chunks.keys()].sort((a, b) => a - b).map(c => `${fmtInt(c * CHUNK)}–${fmtInt(c * CHUNK + CHUNK - 1)}`).join(', ') || 'none',
    'Selection': sel,
    'Focus': focusName,
    'Status 1–4': st.map(s => s || '·').join(' | '),
    'Min. window': `${m.w} × ${m.h} px at 100 % → ${Math.ceil(m.w * S.scale)} × ${Math.ceil(m.h * S.scale)} px at ${S.scale * 100} %`,
    'Fits 1920×1080?': fitPx(1080) ? '<span class="good">yes</span>' : `<span class="bad">no: needs ${Math.ceil(m.h * S.scale)} px of about 1,040</span>`,
    'Access keys': `${ak.count} letters in use (menu bar included)` + (ak.dup.length ? ` — <span class="bad">clashes: ${ak.dup.map(([k, v]) => k.toUpperCase() + ' (' + v.join(', ') + ')').join('; ')}</span>` : ' — <span class="good">no clash</span>'),
  };
  const rows = Object.entries(fields).map(([k, v]) => `<tr><td>${k}</td><td class="${prevPanel[k] !== undefined && prevPanel[k] !== v ? 'changed' : ''}">${v.startsWith('<span') || v.includes('<span') ? v : esc(v)}</td></tr>`).join('');
  prevPanel = fields;
  if (!P._built) {
    P._built = true;
    P.innerHTML = `<h1>gozler-ui prototype</h1>
      <p>Throwaway. It draws the window that <b>ui-spec.md</b> specifies, as Windows 11 draws common controls, on 260,000 synthetic entries with daemon-like delays. The question: does each screen, label, group, key and state pass the owner's review before stage 1 builds it?</p>
      <p>It imitates Win32 and proves nothing about it: UI Automation, real DPI scaling and IsDialogMessageW stay for the real window.</p>
      <h2>Display</h2>
      <div class="row2"><span>Scale</span><button data-scale="1">100 %</button><button data-scale="1.5">150 %</button>
        <label><input type="checkbox" id="hcbox"> High contrast</label></div>
      <div class="row2"><span>Language</span><button data-lang="default">Windows default</button><button data-lang="en">English</button><button data-lang="qps-ploc">Pseudo</button></div>
      <h2>Daemon and environment</h2>
      <div class="row2"><select id="dsel">${Object.entries(DAEMON).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select><button id="dgo">Search now</button></div>
      <div class="row2"><button id="psc">Press the shortcut in another program</button><button id="pact">Switch to gozler from another program</button></div>
      <div class="row2">
        <label><input type="checkbox" data-flag="cIndexing"> C:\\ indexing</label><label><input type="checkbox" data-flag="dOffline"> D:\\ offline</label>
        <label><input type="checkbox" data-flag="dMeta"> D:\\ sizes/dates unknown</label><label><input type="checkbox" data-flag="slow"> Slow replies (2 s)</label>
        <label><input type="checkbox" data-flag="hold"> Hold every reply</label><label><input type="checkbox" data-flag="exportFails"> Next export fails</label>
        <label><input type="checkbox" data-flag="filesGone"> Files no longer exist</label><label><input type="checkbox" data-flag="clipBusy"> Clipboard busy</label>
        <label><input type="checkbox" data-flag="settingsFail"> Settings cannot be saved</label><label><input type="checkbox" data-flag="noTC"> No Total Commander</label></div>
      <h2>States and scenarios</h2><div class="row2" id="scen"></div>
      <h2>Model state</h2><table id="ptab"></table>
      <h2>Event log</h2><div id="log"></div>
      <h2>Try</h2><p>Tab and Shift+Tab; Alt alone, then arrows; Alt+F, Alt+A (Match), Alt+C, Alt+P, Alt+K (Kind), Alt+O (Location); Down from the search box; Shift+arrows and Ctrl+A in the list; Shift+F10; F1; Ctrl+, (Settings; on Keyboard, press a shortcut; Ctrl+Alt+T stands for one that another program holds); Alt+Enter; Ctrl+Enter; right-click the header; drag the splitter, the column edges and the window corner.</p>`;
    P.querySelectorAll('[data-scale]').forEach(b => b.onclick = () => { S.scale = +b.dataset.scale; layout(); renderPanel(); });
    P.querySelector('#hcbox').onchange = e => { S.hc = e.target.checked; document.body.classList.toggle('hc', S.hc); renderRows(); };
    P.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => setLanguage(b.dataset.lang));
    P.querySelector('#dsel').onchange = e => { S.daemon = e.target.value; log('daemon: ' + DAEMON[S.daemon]); renderPanel(); };
    P.querySelector('#dgo').onclick = () => runSearch('panel');
    const pact = P.querySelector('#pact'); pact.onmousedown = e => e.preventDefault();
    pact.onclick = () => { if (UI.win.hidden) { log('the window is hidden: there is nothing to switch to'); return; }
      if (S.settings.actSel) { UI.search.focus(); UI.search.select(); log('activated: the search box has the focus, its text selected'); } else log('activated: the focus stays where it was'); };
    P.querySelector('#psc').onclick = () => { if (S.settings.hotkey) showWindow(hotkeyShort(S.settings.hotkey)); else log('no shortcut is set: the key goes to the other program'); };
    P.querySelectorAll('[data-flag]').forEach(c => c.onchange = () => { S[c.dataset.flag] = c.checked; if (c.dataset.flag === 'hold' && !c.checked) releaseHold(); if (c.dataset.flag === 'settingsFail') S.settingsWarned = false; log(`${c.dataset.flag}: ${c.checked}`); syncFilterControls(); update(); });
    const sc = P.querySelector('#scen');
    for (const [name, fn] of SCEN) { const b = h('button', {}, name); b.onclick = () => { resetForScenario(); releaseHold(); fn(); log('scenario: ' + name); update(); syncPanelInputs(); }; sc.append(b); }
  }
  P.querySelector('#ptab').innerHTML = rows;
  P.querySelector('#log').textContent = S.log.join('\n');
  syncPanelInputs();
}
function syncPanelInputs() {
  const P = document.getElementById('panel');
  P.querySelector('#dsel').value = S.daemon;
  P.querySelectorAll('[data-flag]').forEach(c => c.checked = !!S[c.dataset.flag]);
}

// ---------- prototype chrome ----------
document.getElementById('vpanel').onclick = () => { document.body.classList.toggle('nopanel'); if (S.win.maxed) layout(); };

// ---------- start ----------
setTimeout(() => {
  makeCorpus();
  // Location lists every indexed volume from Status.
  S.F.locItems = [{ path: 'C:\\' }, { path: 'D:\\' }];
  build(); applyIndexSettings(); wireTray(); updateTray(); setLanguage('default');
  layout(); syncFilterControls(); update();
  document.getElementById('loading').remove();
  UI.search.focus({ preventScroll: true });
  runSearch('start');
  window.addEventListener('resize', () => { if (S.win.maxed) layout(); });
}, 30);
</script>
