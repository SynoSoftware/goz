[package]
name = "gozler-ui"
description = "gozler-ui: the gozler window, a native Win32 two-panel file manager that searches through gozlerd and copies, moves and deletes files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["Synapse N.V."]
repository.workspace = true
publish = false

[[bin]]
name = "gozler-ui"
path = "src/main.rs"

[features]
# Adds the pseudo-language qps-ploc, which build.rs generates from en.json,
# so screenshots show where a longer translation would clip. A shipped build
# leaves it out.
pseudo-language = ["dep:serde_json"]

[dependencies]
gozler-core = { path = "../gozler-core" }
gozler-client = { path = "../gozler-client" }
gozler-fileops = { path = "../gozler-fileops" }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
gozler-winfs = { path = "../gozler-winfs" }
# Settings > Visibility's Select Users or Groups dialog, and the VARIANT
# that brings each chosen account's SID; QueryPerformanceCounter for the
# times in ui-frames.log, which align with a screen recording's frames; the
# cloak of the presenter's cover.
windows = { workspace = true, features = [
    "Win32_Graphics_Dwm",
    "Win32_Networking_ActiveDirectory",
    "Win32_System_Performance",
    "Win32_System_Variant",
] }
windows-core.workspace = true

[build-dependencies]
embed-resource.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
