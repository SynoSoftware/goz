[package]
name = "gozler-ui"
description = "gozler-ui: the gozler window, a native Win32 search window over gozlerd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "gozler-ui"
path = "src/main.rs"

[features]
# Adds the pseudo-language qps-ploc, which build.rs generates from en.json,
# so screenshots show where a longer translation would clip. A shipped build
# leaves it out.
pseudo-language = ["dep:serde_json"]

[dependencies]
gozler-core = { path = "../gozler-core" }
gozler-client = { path = "../gozler-client" }
gozler-fileops = { path = "../gozler-fileops" }
jiff.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
gozler-winfs = { path = "../gozler-winfs" }
windows.workspace = true
windows-core.workspace = true

[build-dependencies]
embed-resource.workspace = true
serde_json = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
