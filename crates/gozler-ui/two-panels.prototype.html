<style>
/* Layout: a Windows 11 desktop at 100 % scale; the window is drawn with the
   system colors GetSysColor gives in the default light theme, because Gozler
   has no dark mode (DESIGN.md, owner decision). */
:root {
  --window: #ffffff;        /* COLOR_WINDOW */
  --text: #000000;          /* COLOR_WINDOWTEXT */
  --face: #f0f0f0;          /* COLOR_BTNFACE */
  --hl: #0078d7;            /* COLOR_HIGHLIGHT */
  --hltext: #ffffff;        /* COLOR_HIGHLIGHTTEXT */
  --gray: #6d6d6d;          /* COLOR_GRAYTEXT */
  --line: #e5e5e5;          /* one-pixel dividers */
  --header: #4c607a;        /* list view header text, Explorer theme */
  --explorer-sel: #cce8ff;  /* list view selection fill, Explorer theme */
  --desk: #d7dde4;          /* the desktop behind the window */
  --ui: "Segoe UI", system-ui, sans-serif;
  --mono: Consolas, "Cascadia Mono", "Courier New", monospace;
  --icons: "Segoe Fluent Icons", "Segoe MDL2 Assets";
}
html, body { margin: 0; background: var(--desk); color: var(--text); font: 12px/1.35 var(--ui); }
body { padding-block: 16px 84px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.note { max-width: 1060px; margin: 0 auto 12px; display: grid; gap: 4px; }
.note .tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #5a6470; }
.note h1 { font-size: 18px; font-weight: 600; margin: 0; text-wrap: balance; }
.note p { margin: 0; max-width: 75ch; font-size: 13px; color: #2b3138; }
.note kbd { font: 12px var(--ui); background: #eef1f4; border: 1px solid #b9c1ca; border-radius: 3px; padding: 0 4px; }
.desk { overflow-x: auto; }
.stage { position: relative; width: 1060px; margin: 0 auto; }
.ico { font-family: var(--icons); font-style: normal; font-size: 12px; line-height: 1; }

/* Window frame */
.win { background: var(--window); border: 1px solid #8a8f96; box-shadow: 0 8px 28px rgba(20,30,40,.28); display: flex; flex-direction: column; }
.titlebar { height: 30px; display: flex; align-items: center; background: #f3f3f3; padding-left: 10px; }

.titlebar .cap { width: 46px; height: 30px; display: grid; place-items: center; font-family: var(--icons); font-size: 10px; }

.menubar span { padding: 1px 7px; }
.menubar span.open { background: #cce8ff; outline: 1px solid #99d1ff; }
.menubar .right { margin-left: auto; }

/* Panels */
.panels { display: grid; grid-template-columns: 1fr 1fr; flex: 1; min-height: 0; }

.panel:last-child { border-right: 0; }

.edit { height: 21px; flex: 1; border: 1px solid #c4c4c4; border-bottom-color: #868686; border-radius: 3px; padding: 0 6px; display: flex; align-items: center; white-space: nowrap; overflow: hidden; background: var(--window); }

/* Selection variants. A: Commander. B: Explorer. C: marks. */

/* Popups: menus, tooltips, dialogs, balloons */
.menu { position: absolute; background: #f9f9f9; border: 1px solid #ccc; box-shadow: 2px 3px 8px rgba(0,0,0,.2); padding: 2px; min-width: 230px; z-index: 5; }

.dlg { position: absolute; background: var(--face); border: 1px solid #8a8f96; box-shadow: 0 10px 30px rgba(0,0,0,.3); z-index: 7; display: flex; flex-direction: column; }
.dlg .titlebar { background: #ffffff; height: 30px; }

.dlg .body { padding: 11px; display: grid; gap: 7px; }

/* Viewer */

.proto-bar button { background: #2a313a; color: inherit; border: 0; border-radius: 14px; padding: 4px 10px; font: inherit; cursor: pointer; }

.proto-bar button.on { background: #e8eef5; color: #14181d; }
.proto-bar .lab { min-width: 220px; text-align: center; }

<script>
const G = { folder: "\uE8B7", up: "\uE74A", file: "\uE8A5", chevron: "\uE70D", check: "\uE73E", right: "\uE76C",
  min: "\uE921", max: "\uE922", close: "\uE8BB", copy: "\uE8C8", move: "\uE8DE", cancel: "\uE711", add: "\uE710",
  ok: "\uE8FB", retry: "\uE72C", open: "\uE8E5", view: "\uE890", edit: "\uE70F", info: "\uE946", rename: "\uE8AC",
  newfolder: "\uE8F4", del: "\uE74D", settings: "\uE713", cut: "\uE8C6", paste: "\uE77F", link: "\uE71B", err: "\uE711",
  select: "\uE8B3", find: "\uE721", copyto: "\uF413", warn: "\uE7BA", refresh: "\uE72C" };

// Shell icons drawn small: a folder, a file, the folder-up arrow.
const svgFolder = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 3.5h5l1.5 1.5H15v8.5H1z" fill="#e8b54a"/><path d="M1 6h14v7.5H1z" fill="#f8d775"/></svg>';
const svgFile = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 1.5h6.5L13 5v9.5H3z" fill="#fff" stroke="#8a96a3"/><path d="M9.5 1.5V5H13" fill="#e9eef3" stroke="#8a96a3"/></svg>';
const svgPdf = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 1.5h6.5L13 5v9.5H3z" fill="#fff" stroke="#8a96a3"/><rect x="2" y="8" width="9" height="5" fill="#d13438"/></svg>';
const svgXls = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 1.5h6.5L13 5v9.5H3z" fill="#fff" stroke="#8a96a3"/><rect x="2" y="8" width="9" height="5" fill="#107c41"/></svg>';
const svgUp = '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 3.5h5l1.5 1.5H15v8.5H1z" fill="#e8b54a"/><path d="M1 6h14v7.5H1z" fill="#f8d775"/><path d="M8 7.5l-2.5 2.5M8 7.5l2.5 2.5M8 7.5v4.5" stroke="#7a5a10" stroke-width="1.2" fill="none"/></svg>';
function icon(r) {
  if (r.kind === "up") return svgUp;
  if (r.kind === "folder") return svgFolder;
  if (r.ext === "pdf") return svgPdf;
  if (r.ext === "xlsx") return svgXls;
  return svgFile;
}
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
// Keeps a path's first and last folders when it is longer than `max`.
const midPath = (path, max) => {
  if (path.length <= max) return path;
  const parts = path.split("\\");
  return parts.length > 2 ? `${parts[0]}\\…\\${parts[parts.length - 1]}` : path;
};
// "&Copy" underlines the access key, as Windows draws it.
const acc = s => esc(s).replace(/&amp;(.)/, "<u>$1</u>");

// Sample folders. Sizes in KB as Search's Size column shows them.
const docs = [
  { kind: "up", name: ".." },
  { kind: "folder", name: "Invoices", size: "1,204 KB", date: "2026-10-12 09:41" },
  { kind: "folder", name: "Projects", size: "4,404,019 KB", date: "2026-10-20 14:02" },
  { kind: "folder", name: "Scans", size: "220,512 KB", date: "2026-09-30 17:15" },
  { kind: "file", name: "budget 2026.xlsx", ext: "xlsx", size: "84 KB", date: "2026-10-18 11:20" },
  { kind: "file", name: "desktop.ini", ext: "ini", size: "1 KB", date: "2025-03-02 08:00", hidden: true },
  { kind: "file", name: "notes.txt", ext: "txt", size: "4 KB", date: "2026-10-20 08:55" },
  { kind: "file", name: "report.pdf", ext: "pdf", size: "812 KB", date: "2026-10-19 16:47" },
  { kind: "file", name: "report-draft.pdf", ext: "pdf", size: "790 KB", date: "2026-10-17 10:03" },
  { kind: "file", name: "tax return 2025.pdf", ext: "pdf", size: "2,311 KB", date: "2026-04-28 19:12" },
];
const backup = [
  { kind: "up", name: ".." },
  { kind: "folder", name: "Old laptop", size: "12,880,004 KB", date: "2026-02-11 21:30" },
  { kind: "folder", name: "Photos", size: "48,113,220 KB", date: "2026-10-01 18:04" },
  { kind: "file", name: "notes.txt", ext: "txt", size: "4 KB", date: "2026-09-02 07:44" },
];
const backupCopying = [
  { kind: "up", name: ".." },
  { kind: "folder", name: "Old laptop", size: "12,880,004 KB", date: "2026-02-11 21:30" },
  { kind: "folder", name: "Photos", size: "48,113,220 KB", date: "2026-10-01 18:04" },
  { kind: "folder", name: "Projects", size: "1,673,527 KB", date: "2026-10-20 15:31" },
  { kind: "file", name: "notes.txt", ext: "txt", size: "4 KB", date: "2026-09-02 07:44" },
];
const usb = [
  { kind: "up", name: ".." },
  { kind: "folder", name: "DCIM", size: "Folder", date: "2026-08-14 12:00" },
  { kind: "folder", name: "Music", size: "Folder", date: "2026-05-03 15:22" },
  { kind: "file", name: "setup.exe", ext: "exe", size: "48,220 KB", date: "2026-07-21 10:10" },
];
const downloads = [
  { kind: "up", name: ".." },
  { kind: "folder", name: "Gozler setup", size: "6,112 KB", date: "2026-10-18 09:12" },
  { kind: "file", name: "gozler-0.3.0.msi", ext: "msi", size: "6,104 KB", date: "2026-10-18 09:10" },
  { kind: "file", name: "invoice 0412.pdf", ext: "pdf", size: "412 KB", date: "2026-10-12 09:38" },
  { kind: "file", name: "photos.zip", ext: "zip", size: "1,812,204 KB", date: "2026-10-03 21:44" },
];
const pick = (rows, opts = {}) => rows.map((r, i) => ({ ...r,
  sel: (opts.sel || []).includes(i), focus: opts.focus === i }));

const FOLDER_COLS = [["Name", ""], ["Ext", ""], ["Size", "r"], ["Date modified", ""]];
const SEARCH_COLS = [["Name", ""], ["Ext", ""], ["Folder", ""], ["Size", "r"], ["Date modified", ""]];

function panel(p) {
  const search = p.mode === "search";
  const cols = search ? SEARCH_COLS : FOLDER_COLS;
  const tpl = (search ? "minmax(0,1.3fr) 36px minmax(0,1fr) 92px 112px" : "minmax(0,1fr) 40px 104px 112px");
  // Only look C shows the marks column; looks A and B hide its cells.
  const grid = (variant === "C" ? "16px " : "") + tpl;
  const drive = `<div class="drive">${esc(p.drive)}<span class="ico">${G.chevron}</span></div>`;
  const head = search
    ? `${drive}<div class="edit focus">${esc(p.query)}${p.caret ? '<span class="caret"></span>' : ""}</div>
       <span class="lbl"><u>L</u>ook in:</span><div class="combo">${esc(p.lookIn)}<span class="ico">${G.chevron}</span></div>`
    : `${drive}<div class="edit path${p.pathFocus ? " focus" : ""}">${p.pathHtml || esc(p.path)}${p.pathFocus ? '<span class="caret"></span>' : ""}</div>`;
  const colHtml = `<div class="cols" style="grid-template-columns:${grid}"><div class="mark"></div>${cols.map(([c, cl], i) =>
    `<div class="${cl}${(p.sortCol ?? 0) === i ? " sort" : ""}">${c}</div>`).join("")}</div>`;
  const rows = (p.rows || []).map(r => {
    const cls = ["row", r.sel ? "sel" : "", r.focus ? "focus" : "", r.hidden ? "hidden" : ""].join(" ");
    const name = `<div class="n">${icon(r)}<span>${esc(r.name)}</span></div>`;
    const cells = search
      ? [name, `<div>${esc(r.ext || "")}</div>`, `<div>${esc(midPath(r.folder || "", p.folderMax || 20))}</div>`, `<div class="r">${esc(r.size || "")}</div>`, `<div>${esc(r.date || "")}</div>`]
      : [name, `<div>${r.kind === "file" ? esc(r.ext || "") : ""}</div>`, `<div class="r">${esc(r.size || "")}</div>`, `<div>${esc(r.date || "")}</div>`];
    return `<div class="${cls}" style="grid-template-columns:${grid}"><div class="mark">${r.sel ? G.check : ""}</div>${cells.join("")}</div>`;
  }).join("");
  const msg = p.message ? `<div class="empty-msg"><div>${p.message}</div>${p.button ? `<div class="btn" style="width:auto;padding:0 14px"><span class="ico">${p.button[0]}</span><span>${acc(p.button[1])}</span></div>` : ""}</div>` : "";
  // The quick search box takes the status line's place while it is open.
  const status = p.quick
    ? `<div class="quick">Find: <b style="font-weight:600">${esc(p.quick)}</b><span class="caret"></span></div>`
    : `<span>${esc(p.status || "")}</span><span>${esc(p.free || "")}</span>`;
  return `<div class="panel${p.active ? " active" : ""}">
    <div class="pathrow">${head}</div>
    <div class="list">${colHtml}<div class="rows">${rows}</div>${msg}</div>
    <div class="status-line">${status}</div>
  </div>`;
}

function titlebar(t) {
  return `<div class="titlebar"><span class="t">${esc(t)}</span><span class="cap">${G.min}</span><span class="cap">${G.max}</span><span class="cap">${G.close}</span></div>`;
}
const KEYS = [["F3", "View"], ["F4", "Edit"], ["F5", "Copy"], ["F6", "Move"], ["F7", "New folder"], ["F8", "Delete"]];
// o.dis lists the keys whose commands are disabled on the active panel's
// state; F4 Edit always is.
function mainWindow(o) {
  const menus = ["&File", "&Edit", "&View", "&Help"].map(m => `<span class="${o.menuOpen === m ? "open" : ""}">${acc(m)}</span>`).join("");
  const dis = new Set(["F4", ...(o.dis || [])]);
  const job = o.job
    ? `<div style="gap:7px"><span>${esc(o.job.text)}</span><span class="progress"><i style="width:${o.job.percent}%"></i></span><span class="sbtn">Cancel</span></div>`
    : o.done ? `<div style="gap:6px"><span class="ico" style="color:#0f7b0f">${G.ok}</span><span>${esc(o.done)}</span></div>` : "<div></div>";
  return `<div class="win" style="height:620px">
    ${titlebar("Gozler")}
    <div class="menubar">${menus}<span class="right">${acc("Lan&guage")}</span></div>
    <div class="panels">${panel(o.left)}${panel(o.right)}</div>
    <div class="keybar">${KEYS.map(([k, w]) => `<div class="btn${dis.has(k) ? " dis" : ""}"><b>${k}</b><span>${esc(w)}</span></div>`).join("")}${o.f4tip ? `<div class="tip" style="left:200px;top:-22px">Editing is not available yet.</div>` : ""}${o.f6tip ? `<div class="tip" style="left:547px;top:-22px">Move to the other panel, or rename.</div>` : ""}</div>
    <div class="statusbar" style="grid-template-columns:1fr auto">${job}<div>${esc(o.sRight || "")}</div></div>
  </div>`;
}

function menu(items, x, y, opts = {}) {
  return `<div class="menu" style="left:${x}px;top:${y}px">${items.map(it => {
    if (it === "-") return '<div class="sep"></div>';
    const [label, key, glyph, flags = ""] = it;
    return `<div class="mi${flags.includes("hot") ? " hot" : ""}${flags.includes("dis") ? " dis" : ""}">
      <span class="g ico">${flags.includes("check") ? G.check : flags.includes("radio") ? "●" : (glyph || "")}</span>
      <span>${acc(label)}</span><span class="k">${opts.noKeys ? "" : esc(key || "")}</span>
      <span class="sub">${flags.includes("sub") ? G.right : ""}</span></div>`;
  }).join("")}</div>`;
}

function dialog(title, body, buttons, x, y, w, cls = "") {
  return `<div class="dlg ${cls}" style="left:${x}px;top:${y}px;width:${w}px">
    <div class="titlebar"><span class="t">${esc(title)}</span><span class="cap">${G.close}</span></div>
    <div class="body">${body}</div>
    <div class="buttons">${buttons.map(([g, l, flags = ""]) =>
      `<div class="btn${flags.includes("def") ? " def" : ""}${flags.includes("dis") ? " dis" : ""}"><span class="ico">${g}</span><span>${acc(l)}</span></div>`).join("")}</div>
  </div>`;
}

function viewer(o) {
  return `<div class="win" style="height:560px;width:860px;margin:0 auto;position:relative">
    ${titlebar(o.title)}
    <div class="menubar"><span class="${o.menuOpen === "file" ? "open" : ""}"><u>F</u>ile</span><span class="${o.menuOpen === "view" ? "open" : ""}"><u>V</u>iew</span></div>
    <div class="view" style="position:relative"><pre>${o.body}</pre>${o.message || ""}<div class="vscroll${o.scrollOff ? " off" : ""}"><i style="top:${o.thumbTop}px;height:${o.thumbH}px"></i></div></div>
    <div class="statusbar" style="grid-template-columns:1fr auto"><div>${esc(o.sLeft)}</div><div style="min-width:120px;justify-content:flex-end">${esc(o.sRight)}</div></div>
    ${o.extra || ""}
  </div>`;
}

function hexRows() {
  const bytes = [0x4D,0x5A,0x90,0x00,0x03,0x00,0x00,0x00,0x04,0x00,0x00,0x00,0xFF,0xFF,0x00,0x00,
    0xB8,0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x40,0x00,0x00,0x00,0x00,0x00,0x00,0x00];
  for (let i = 0; i < 24; i++) bytes.push(0);
  bytes.push(0x00,0x01,0x00,0x00,0x0E,0x1F,0xBA,0x0E,0x00,0xB4,0x09,0xCD,0x21,0xB8,0x01,0x4C,0xCD,0x21);
  const msg = "This program cannot be run in DOS mode.\r\r\n$";
  for (const c of msg) bytes.push(c.charCodeAt(0));
  while (bytes.length < 26 * 16) bytes.push((bytes.length * 37 + 11) & 0xFF);
  const out = [];
  for (let r = 0; r < 26; r++) {
    const row = bytes.slice(r * 16, r * 16 + 16);
    const hex = row.map(b => b.toString(16).toUpperCase().padStart(2, "0"));
    const chars = row.map(b => b >= 0x20 && b <= 0x7E ? String.fromCharCode(b) : ".").join("");
    out.push(`<span class="hexoff">${(r * 16).toString(16).toUpperCase().padStart(8, "0")}</span>  ${hex.slice(0, 8).join(" ")}  ${hex.slice(8).join(" ")}  ${esc(chars)}`);
  }
  return out.join("\n");
}

  { t: "Viewer: View menu", d: "Text and Hex are one choice; Wrap long lines is a check. The encoding is detected; the status bar names it.",
    r: () => viewer({ title: "settings.ini – View", body: esc(iniText), scrollOff: true, thumbTop: 0, thumbH: 0, sLeft: "settings.ini · UTF-8 · 2.4 KB", sRight: "Top", menuOpen: "view",
      extra: menu([["&Text", "F4", "", "radio"], ["&Hex", "F4"], "-", ["&Wrap long lines", "F2", "", "check"]], 30, 51) }) },

    r: () => viewer({ title: "payroll.xlsx – View", body: "", scrollOff: true, thumbTop: 0, thumbH: 0, sLeft: "payroll.xlsx", sRight: "",
      message: `<div class="area-msg"><div>Windows could not open payroll.xlsx: Access is denied.</div><div class="btn" style="width:auto;padding:0 14px"><span class="ico">${G.retry}</span><span><u>R</u>etry</span></div></div>` }) },
];

let screen = 0;
let variant = new URLSearchParams(location.search).get("variant") || "A";
try { screen = Math.max(0, SCREENS.findIndex(s => s.t === decodeURIComponent(location.hash.slice(1)))); } catch {}
function show() {
  const s = SCREENS[screen];
  document.body.className = "v-" + variant;
  document.getElementById("stage").innerHTML = s.r();
  document.getElementById("title").textContent = s.t;
  document.getElementById("text").textContent = s.d;
  document.getElementById("count").textContent = `screen ${screen + 1} of ${SCREENS.length}`;
  document.getElementById("lab").textContent = `${screen + 1}/${SCREENS.length}  ${s.t}`;
  document.querySelectorAll("[data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === variant));
  const url = new URL(location.href);
  url.searchParams.set("variant", variant);
  url.hash = encodeURIComponent(s.t);
  try { history.replaceState(null, "", url); } catch {}
}
function go(d) { screen = (screen + d + SCREENS.length) % SCREENS.length; show(); }
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { variant = b.dataset.v; show(); });
addEventListener("keydown", e => {
  if (e.target.closest("input,textarea,[contenteditable]")) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
show();
</script>
