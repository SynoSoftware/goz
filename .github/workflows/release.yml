name: Release

# Fires only when a version tag is pushed (e.g. `git tag v0.1.1 && git push
# --tags`). It guards that the tag matches Cargo.toml, then builds the Windows
# binaries and publishes them as a GitHub Release.
on:
  push:
    tags:
      - "v*"

# Least privilege by default; the release job elevates to contents: write.
permissions:
  contents: read

jobs:
  version-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compare the pushed tag (minus its leading `v`) against the workspace
      # version in Cargo.toml. Fail loudly on any mismatch so the fix is to
      # bump Cargo.toml (or retag), never to ship the two out of sync.
      - name: Tag matches Cargo.toml version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')"
          echo "tag:      $tag"
          echo "manifest: $manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::git tag v$tag does not match Cargo.toml version $manifest; bump Cargo.toml or retag"
            exit 1
          fi

  release:
    needs: version-guard
    runs-on: windows-latest
    permissions:
      contents: write # required to create the release and upload assets
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2 # after the toolchain: keyed off the rustc version

      # Setup.iss needs Inno Setup 7.1, so install that exact version instead of
      # relying on whatever the runner image carries. The pinned hash is the release asset signed by Pyrsys B.V., the Inno
      # Setup publisher, so a replaced download fails here.
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -OutFile $installer `
            https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
          if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') {
            throw 'The Inno Setup download does not match the pinned SHA-256.'
          }
          $dir = Join-Path $env:RUNNER_TEMP 'inno'
          $setup = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList `
            "/CURRENTUSER /PORTABLE=1 /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /NOICONS /DIR=`"$dir`""
          if ($setup.ExitCode -ne 0) { throw "Inno Setup did not install (exit $($setup.ExitCode))." }
          "INNO_COMPILER=$dir\ISCC.exe" >> $env:GITHUB_ENV

      # Builds the release binaries and target/installer/gozler-<version>-x64-Setup.exe.
      # GOZLER_RELEASE keeps the build date out of the version (gozler-core's
      # build.rs).
      - name: Build binaries and installer
        shell: pwsh
        env:
          GOZLER_RELEASE: "1"
        run: ./installer/Build.ps1 -Compiler $env:INNO_COMPILER

      # Bundle the three programs with the license and readme into one archive
      # named after the tag, so the download is self-contained.
      - name: Package archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Force -DestinationPath "dist/gozler-${{ github.ref_name }}-windows-x86_64.zip" -Path `
            target/release/gozler.exe, `
            target/release/gozlerd.exe, `
            target/release/gozler-ui.exe, `
            LICENSE, `
            README.md

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            target/installer/*.exe
